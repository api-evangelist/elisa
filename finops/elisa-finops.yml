description: >-
  There is no FinOps surface for ELISA, because there is no metered API cost to manage. The API
  ELISA publishes at https://elisa.tech/wp-json/ is free, anonymous and unmetered — no key, no
  quota, no per-request charge, no invoice. ELISA's revenue is annual organizational membership
  dues (see plans/elisa-plans-pricing.yml), a fixed subscription unrelated to API consumption.
  This file REPLACES a 2026-05-04 bulk-sweep scaffold that asserted a Usage-Based pricing
  category, monthly USD billing, an invoice issuer, and api_requests / data_egress /
  compute_seconds meters with cost-per-1K-requests unit economics. ELISA bills none of that.
  See roadmap#35.
billingModel:
  pricingCategory: None
  metered: false
  billingCurrency: USD
  note: Membership dues are annual and fixed by employee band; they are not an API charge.
