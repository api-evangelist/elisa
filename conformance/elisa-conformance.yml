domain_standards:
  note: >-
    ELISA's market is functional safety for Linux — the standards that matter in it are ISO 26262
    (automotive), IEC 61508 (industrial), IEC 62304 (medical devices), DO-178C (avionics),
    EN 50716/50128 (railways) and ISO/PAS 8926. ELISA is one of the most standards-engaged
    organisations in the catalog: those standards are the entire subject of its working groups,
    white papers and seminar series.
    But this pipeline records a DOMAIN-STANDARD CONFORMANCE only when the CONTRACT declares it,
    and ELISA's published contract is an events/calendar API. There is no functional-safety
    message type, schema URN or identifier scheme in it, because it is not a functional-safety
    API — it is the API of the organisation's website. Recording an ISO 26262 conformance here
    would be reading the company's subject matter into a contract that says nothing about it.
    This is a reward-only dimension, so an honest absence costs ELISA nothing.
