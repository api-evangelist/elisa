note: >-
  Only the 9 read operations are proposed as tools. The 15 write operations (POST/DELETE across
  events, venues, organizers, categories and tags) are deliberately excluded from this candidate
  set: the contract publishes no reversal operation and no retention window for a delete
  (see conventions/elisa-conventions.yml reversibility), so exposing them to an agent would be
  handing it an irreversible action it cannot reason about.
