adjacent_signal:
  note: >-
    The wp-abilities/v1 namespace IS registered — the WordPress Abilities API, an agent-facing
    capability registry and the layer the WordPress MCP adapter builds on. Its namespace index is
    readable anonymously; the abilities listing itself is authenticated
    (GET /wp-json/wp-abilities/v1/abilities returns 401 rest_forbidden). ELISA is therefore one
    plugin away from a real MCP surface, which is the most actionable agent-readiness finding for
    this provider.
