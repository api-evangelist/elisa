aid: elisa
name: ELISA
description: >-
  ELISA (Enabling Linux in Safety Applications) is a Linux Foundation collaborative project that
  builds the shared tools, processes and evidence needed to use Linux in safety-critical systems.
  Its working groups and special interest groups span automotive, aerospace, medical devices,
  railways, space-grade Linux and open-source engineering process, producing white papers, case
  studies, kernel analysis tooling and a public technical directory. ELISA develops two tools of
  its own: BASIL, a software quality management and traceability application with an HTTP REST
  API and SPDX 3.0.1 export, and ks-nav, kernel-source navigation tooling. ELISA itself publishes
  a machine-readable API surface at https://elisa.tech/wp-json/ — declared through an RFC 9727
  api-catalog and described by a live OpenAPI 3.0.0 document — plus an llms.txt and permissive
  Content Signals for AI use.
