apis:
  - aid: elisa:elisa-events-api
    name: ELISA Events API
    description: >-
      ELISA's live event calendar as a read-and-write REST API — workshops, seminars, conference
      appearances, plus the venues, organizers, categories and tags behind them. Thirty operations
      across fourteen paths, described by an OpenAPI 3.0.0 document ELISA serves at
      /wp-json/tribe/events/v1/doc and declared through its RFC 9727 api-catalog. Reads are
      anonymous and were verified live; writes require a WordPress Application Password.
    humanURL: https://elisa.tech/events/
    baseURL: https://elisa.tech/wp-json/tribe/events/v1/
    tags:
      - Events
      - Calendar
      - Linux Foundation
      - Safety
