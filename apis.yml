  - aid: elisa:elisa-basil-api
    name: BASIL REST API
    description: >-
      BASIL — "The FuSa Spice" — is ELISA's own software quality management tool. It decomposes a
      software component specification into snippets, maps work items (software requirements, test
      specifications, test cases, test runs, justifications, documents) onto them, tracks
      completeness and exports a traceability matrix as SPDX Model 3, HTML or PDF. It ships a
      Flask HTTP REST API specifically so it can be driven from automated toolchains, and it is
      self-hosted — operators build the API and app containers from the provided Containerfiles.
      No OpenAPI or other machine-readable contract is published for it.
    humanURL: https://basil-the-fusa-spice.readthedocs.io/
    baseURL: null
    tags:
      - Traceability
      - Functional Safety
      - Quality Management
      - SPDX
    properties:
